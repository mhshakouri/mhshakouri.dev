name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build first: it generates .content-collections/, which the
      # content-collections tsconfig alias needs for typecheck to resolve.
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run arrowword:typecheck
      - run: npm run format:check
